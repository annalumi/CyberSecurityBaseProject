<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
</head>
<body>
    <h2>Login</h2>
    {% if form.errors %}
      <p style="color: red;">Invalid username or password</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label>Username:</label> {{ form.username }}<br>
        <label>Password:</label> {{ form.password }}<br>
        <input type="submit" value="Log in">
    </form>
</body>
</html>
